<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Core Meta Tags & SEO -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blossom &amp; Leaf | Botanical Shop</title>
    <meta name="description" content="Discover beautiful, low-maintenance indoor plants and elegant blooms to brighten your home or workspace.">
    
    <!-- SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <!-- Sticky Header Navigation -->
    <header class="site-header">
        <div class="container header-container">
            <!-- Brand Logo -->
            <div class="brand">
                <i class="fa-solid fa-leaf brand-icon" aria-hidden="true"></i>
                <a href="#" class="logo">Blossom &amp; Leaf</a>
            </div>
            
            <!-- Centered Nav Links -->
            <nav class="site-nav" aria-label="Main Navigation">
                <ul class="nav-list">
                    <li class="nav-item"><a href="#featured" class="nav-link active">Shop</a></li>
                    <li class="nav-item"><a href="#about" class="nav-link">Our Story</a></li>
                    <li class="nav-item"><a href="#testimonials" class="nav-link">Reviews</a></li>
                </ul>
            </nav>

            <!-- Quick Action Icons -->
            <div class="header-actions">
                <a href="#newsletter" class="action-icon-btn" aria-label="Subscribe to Newsletter">
                    <i class="fa-regular fa-envelope"></i>
                </a>
                <a href="#cart" class="action-icon-btn cart-btn" aria-label="Shopping Cart with 2 items">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-count">2</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Full-Width Hero -->
    <section class="full-section section-hero">
        <div class="container text-center">
            <span class="tagline"><i class="fa-solid fa-spa"></i> Breathe Life Into Your Space</span>
            <h1 class="hero-title">Handpicked Indoor Plants</h1>
            <p class="hero-subtitle">Elevate your home with our curated collection of lush, air-purifying foliage nurtured for vibrant modern living.</p>
            <a href="#featured" class="btn btn-primary"><i class="fa-solid fa-store"></i> Shop Collection</a>
        </div>
    </section>
</body>
</html>
